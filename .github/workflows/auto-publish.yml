name: Auto-publish trending issues

on:
  schedule:
    # Every 6 hours, at 00/06/12/18 UTC ≈ 09/15/21/03 KST.
    - cron: '0 */6 * * *'
  workflow_dispatch: # manual trigger from Actions tab

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm ci

      - name: Run auto-generator
        env:
          # Quality-first LLM fallback chain (writer + trend triage):
          #   Cerebras gpt-oss-120b → Gemini 2.5 flash → Groq → TokenMix → OpenRouter.
          # Only the keys you set participate; the engine runs on whatever is present.
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_MODEL: ${{ vars.CEREBRAS_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TOKENMIX_API_KEY: ${{ secrets.TOKENMIX_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MAX_NEW_PER_RUN: '5'
        run: npx tsx scripts/auto-generate.ts

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "AllThatAI Real Bot"
          git config user.email "bot@allthatai.kr"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "auto: $(date -u +%Y-%m-%d) trending issues"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Submit fresh URLs to IndexNow (Bing/Yandex/Seznam)
        if: steps.commit.outputs.changed == 'true' && hashFiles('fresh-urls.txt') != ''
        run: cat fresh-urls.txt | npx tsx scripts/indexnow-ping.ts
