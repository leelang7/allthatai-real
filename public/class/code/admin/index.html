<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>코드 공유 관리 — 강의</title>
<meta name="robots" content="noindex" />
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  :root {
    --bg:#0d1117; --card:#161b22; --card2:#1c232c; --line:#2a323d;
    --ink:#e6edf3; --sub:#9aa7b4; --accent:#4fc0d0; --accent2:#7c9cff; --danger:#f0616d;
    --radius:14px;
  }
  body {
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:820px; margin:0 auto; padding:36px 20px 90px; }
  h1 { font-size:1.4rem; font-weight:800; }
  h1 span { color:var(--accent); }
  .sub { color:var(--sub); font-size:.9rem; margin-top:4px; }
  .nav { margin-top:14px; display:flex; gap:8px; flex-wrap:wrap; }
  a.chip, button.ghost {
    display:inline-flex; align-items:center; gap:6px; text-decoration:none; color:var(--ink);
    background:var(--card); border:1px solid var(--line); border-radius:99px;
    padding:7px 14px; font-size:.85rem; cursor:pointer;
  }
  a.chip:hover, button.ghost:hover { border-color:var(--accent); color:var(--accent); }
  input, textarea, select {
    width:100%; background:var(--bg); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; padding:10px 12px; font-size:.92rem; outline:none; font-family:inherit;
  }
  input:focus, textarea:focus, select:focus { border-color:var(--accent); }
  textarea.code {
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
    font-size:.85rem; min-height:150px; resize:vertical; white-space:pre; line-height:1.5;
  }
  .login { max-width:360px; margin:60px auto; background:var(--card); border:1px solid var(--line);
    border-radius:var(--radius); padding:26px; }
  .login h2 { font-size:1.05rem; margin-bottom:14px; }
  .row { display:flex; gap:10px; }
  .row > * { flex:1; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-top:16px; }
  .card .grid { display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; }
  .lbl { font-size:.76rem; color:var(--sub); margin:10px 0 4px; }
  .card-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .idx { font-size:.78rem; color:var(--sub); }
  button.primary { background:var(--accent); color:#04222a; border:0; border-radius:10px;
    padding:12px 18px; font-size:.95rem; font-weight:700; cursor:pointer; }
  button.primary:disabled { opacity:.5; cursor:default; }
  button.del { background:transparent; color:var(--danger); border:1px solid rgba(240,97,109,.4);
    border-radius:8px; padding:5px 11px; font-size:.78rem; cursor:pointer; }
  button.del:hover { background:rgba(240,97,109,.1); }
  .bar { position:sticky; bottom:0; background:linear-gradient(transparent,var(--bg) 30%);
    padding:18px 0 6px; margin-top:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .msg { font-size:.86rem; color:var(--sub); }
  .msg.ok { color:#3fb950; } .msg.err { color:var(--danger); }
  @media(max-width:620px){ .card .grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <div id="app"></div>
</div>

<script>
  var API = "/api/class-code/";
  var LOCAL = "classCodeDraft";
  var KEY = "";
  var data = [];
  var LANGS = ["python","javascript","typescript","bash","c","cpp","java","html","css","json","sql","text"];

  function $(s){ return document.querySelector(s); }
  function esc(t){ var d=document.createElement("div"); d.textContent=t==null?"":String(t); return d.innerHTML; }
  function saveDraft(){ try{ localStorage.setItem(LOCAL, JSON.stringify(data)); }catch(_){} }
  function loadDraft(){ try{ var v=localStorage.getItem(LOCAL); return v?JSON.parse(v):null; }catch(_){ return null; } }

  function loginView(){
    $("#app").innerHTML =
      '<div class="login"><h2>🔒 코드 공유 관리자</h2>'
      + '<div class="lbl">관리자 키</div>'
      + '<input id="key" type="password" placeholder="ADMIN_KEY" />'
      + '<div class="row" style="margin-top:14px"><button class="primary" id="go" style="flex:1">들어가기</button></div>'
      + '<div class="msg" id="lmsg" style="margin-top:10px"></div>'
      + '<div class="nav"><a class="chip" href="/class/code/">← 학생 화면</a></div></div>';
    $("#go").onclick = login;
    $("#key").addEventListener("keydown", function(e){ if(e.key==="Enter") login(); });
  }

  function login(){
    var k = ($("#key")||{}).value ? $("#key").value.trim() : "";
    if (!k){ $("#lmsg").textContent="키를 입력하세요"; return; }
    KEY = k;
    // 저장 시 키 검증됨. 우선 데이터 로드.
    fetch(API).then(function(r){return r.json();}).then(function(d){
      var draft = loadDraft();
      data = draft || (d && d.snippets) || [];
      try{ sessionStorage.setItem("classCodeKey", KEY); }catch(_){}
      editorView();
    }).catch(function(){ $("#lmsg").textContent="불러오기 실패"; });
  }

  function blank(){ return { id:"s"+Date.now()+Math.floor(Math.random()*99), title:"", course:"공통", lang:"python", desc:"", code:"" }; }

  function editorView(){
    $("#app").innerHTML =
      '<h1>코드 <span>공유</span> 관리</h1>'
      + '<div class="sub">코드를 올리면 <b>/class/code</b> 에서 학생이 복사해 갑니다.</div>'
      + '<div class="nav"><a class="chip" href="/class/code/" target="_blank">👁 학생 화면 보기</a>'
      + '<button class="ghost" id="add">+ 스니펫 추가</button>'
      + '<a class="chip" href="/class/">강의 자료실</a></div>'
      + '<div id="cards"></div>'
      + '<div class="bar"><button class="primary" id="save">저장하기</button>'
      + '<span class="msg" id="msg"></span></div>';
    $("#add").onclick = function(){ data.push(blank()); saveDraft(); renderCards(); window.scrollTo(0,document.body.scrollHeight); };
    $("#save").onclick = save;
    renderCards();
  }

  function renderCards(){
    var box = $("#cards");
    if (!data.length){ box.innerHTML = '<div class="card" style="text-align:center;color:var(--sub)">스니펫이 없습니다. “+ 스니펫 추가”로 시작하세요.</div>'; return; }
    box.innerHTML = data.map(function(s,i){
      return '<div class="card" data-i="'+i+'">'
        + '<div class="card-top"><span class="idx">#'+(i+1)+'</span>'
        + '<button class="del" data-del="'+i+'">삭제</button></div>'
        + '<div class="grid">'
        +   '<div><div class="lbl">제목</div><input data-f="title" value="'+esc(s.title)+'" placeholder="예: 02강 이미지 이진화"/></div>'
        +   '<div><div class="lbl">과정/태그</div><input data-f="course" value="'+esc(s.course)+'" placeholder="예: 비전검사"/></div>'
        +   '<div><div class="lbl">언어</div><select data-f="lang">'
        +      LANGS.map(function(l){ return '<option value="'+l+'"'+(s.lang===l?' selected':'')+'>'+l+'</option>'; }).join("")
        +   '</select></div>'
        + '</div>'
        + '<div class="lbl">설명(선택)</div><input data-f="desc" value="'+esc(s.desc)+'" placeholder="한 줄 설명"/>'
        + '<div class="lbl">코드</div><textarea class="code" data-f="code" placeholder="여기에 코드 붙여넣기">'+esc(s.code)+'</textarea>'
        + '</div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-f]"), function(el){
      el.addEventListener("input", function(){
        var card = el.closest(".card"); var i = +card.getAttribute("data-i");
        data[i][el.getAttribute("data-f")] = el.value; saveDraft();
      });
    });
    Array.prototype.forEach.call(box.querySelectorAll("[data-del]"), function(el){
      el.onclick = function(){ data.splice(+el.getAttribute("data-del"),1); saveDraft(); renderCards(); };
    });
  }

  function save(){
    var msg = $("#msg"); msg.className="msg"; msg.textContent="저장 중…";
    var clean = data
      .map(function(s){ return { id:s.id||("s"+Date.now()), title:(s.title||"").trim(), course:(s.course||"").trim(),
                                 lang:(s.lang||"text").trim(), desc:(s.desc||"").trim(), code:s.code||"" }; })
      .filter(function(s){ return s.title && s.code.length; });
    if (!clean.length){ msg.className="msg err"; msg.textContent="제목과 코드가 있는 스니펫이 하나도 없습니다"; return; }
    fetch(API + "?key=" + encodeURIComponent(KEY), {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ snippets: clean })
    }).then(function(r){ return r.json().then(function(d){ return { ok:r.ok, d:d }; }); })
      .then(function(res){
        if (!res.ok || !res.d.ok){
          msg.className="msg err";
          msg.textContent = (res.d && res.d.error) || "저장 실패";
          return;
        }
        data = clean; saveDraft(); renderCards();
        msg.className="msg ok";
        msg.textContent = res.d.via==="github"
          ? "저장됨 · 스니펫 "+res.d.saved.snippets+"개 — 1~2분 뒤 학생 페이지에 반영됩니다"
          : "저장됨 · 스니펫 "+res.d.saved.snippets+"개 (즉시 반영)";
      })
      .catch(function(){ msg.className="msg err"; msg.textContent="네트워크 오류"; });
  }

  // 시작
  loginView();
  var savedKey = sessionStorage.getItem("classCodeKey");
  if (savedKey){ $("#key").value = savedKey; login(); }
</script>
</body>
</html>
