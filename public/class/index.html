<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 자료실 — 이석창 강사</title>
<meta name="description" content="과정별 강의 자료와 실습 링크를 한곳에서.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="강의 자료실 — 이석창 강사">
<meta property="og:description" content="과정별 강의 자료와 실습 링크를 한곳에서.">
<meta property="og:image" content="https://real.allthatai.kr/class/avatar.jpg">
<link rel="icon" href="/appicon.png">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c232c; --line:#2a323d;
    --ink:#e6edf3; --sub:#9aa7b4; --accent:#4fc0d0; --accent2:#7c9cff;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 20px 64px;
  }
  .wrap{max-width:820px;margin:0 auto}

  /* ── 헤더 ── */
  header{padding:48px 0 26px;border-bottom:1px solid var(--line);margin-bottom:26px;
    display:flex;gap:20px;align-items:center;flex-wrap:wrap}
  .avatar{
    flex:none;width:84px;height:84px;border-radius:50%;object-fit:cover;
    border:2px solid rgba(79,192,208,.45);box-shadow:0 4px 18px rgba(0,0,0,.4);
  }
  .head-txt{flex:1;min-width:220px}
  .eyebrow{
    display:inline-block;font-size:.74rem;letter-spacing:.14em;color:var(--accent);
    border:1px solid rgba(79,192,208,.35);background:rgba(79,192,208,.08);
    padding:4px 11px;border-radius:99px;margin-bottom:10px;
  }
  h1{font-size:clamp(1.5rem,4.5vw,2rem);letter-spacing:-.02em;font-weight:800;line-height:1.25}
  h1 span{color:var(--accent)}
  .who{margin-top:6px;color:var(--sub);font-size:.94rem}

  /* ── 연락처 ── */
  .contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .chip{
    display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:99px;
    padding:7px 14px;font-size:.86rem;transition:.15s;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--card2)}

  /* ── 과정(폴더) ── */
  .course{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    margin-bottom:14px;overflow:hidden;
  }
  .course > summary{
    list-style:none;cursor:pointer;padding:18px 20px;display:flex;align-items:center;gap:14px;
    transition:.15s;
  }
  .course > summary::-webkit-details-marker{display:none}
  .course > summary:hover{background:var(--card2)}
  .folder{
    flex:none;width:42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:1.2rem;
    background:rgba(79,192,208,.12);border:1px solid rgba(79,192,208,.25);
  }
  .c-txt{flex:1;min-width:0}
  .c-txt b{display:block;font-size:1.02rem;font-weight:700}
  .c-txt small{display:block;color:var(--sub);font-size:.84rem;margin-top:1px}
  .count{flex:none;font-size:.76rem;color:var(--sub);background:var(--bg);
    border:1px solid var(--line);border-radius:99px;padding:3px 10px}
  .caret{flex:none;color:var(--sub);transition:.2s}
  .course[open] .caret{transform:rotate(90deg);color:var(--accent)}

  .files{padding:0 14px 14px;display:grid;gap:8px}
  .file{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    background:var(--bg);border:1px solid var(--line);border-radius:12px;
    padding:13px 15px;transition:.15s;
  }
  .file:hover{border-color:var(--accent);background:var(--card2);transform:translateX(2px)}
  .fi{flex:none;font-size:1.05rem;width:26px;text-align:center}
  .ft{flex:1;min-width:0}
  .ft b{display:block;font-size:.94rem;font-weight:600}
  .ft small{display:block;color:var(--sub);font-size:.82rem;margin-top:1px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{flex:none;font-size:.68rem;padding:2px 8px;border-radius:99px;
    background:rgba(124,156,255,.14);color:var(--accent2);border:1px solid rgba(124,156,255,.3)}
  .go{flex:none;color:var(--sub);font-size:.95rem}
  .file:hover .go{color:var(--accent)}

  .note{
    margin-top:22px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:15px 18px;color:var(--sub);font-size:.88rem;
  }
  .note b{color:var(--ink)}
  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    color:var(--sub);font-size:.82rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--accent);text-decoration:none}
  .codebox{margin-top:18px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px}
  .cb-head{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
  .cb-head span{font-weight:700;font-size:.94rem}
  .cb-head small{color:var(--sub);font-size:.8rem}
  .cb-row{display:flex;gap:8px;flex-wrap:wrap}
  .cb-row input{flex:1;min-width:150px;font:inherit;font-size:.9rem;color:var(--ink);
    background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 12px}
  .cb-row input:focus{outline:none;border-color:var(--accent)}
  .cb-row button{font:inherit;font-size:.88rem;font-weight:600;cursor:pointer;border-radius:9px;
    border:1px solid var(--accent);background:var(--accent);color:#06222a;padding:9px 16px}
  .cb-row button.ghost{background:transparent;color:var(--sub);border-color:var(--line)}
  .cb-row button:hover{filter:brightness(1.08)}
  #codeMsg{margin-top:8px;font-size:.83rem;color:var(--sub);min-height:1em}
  #codeMsg.ok{color:#3fb950}
  #codeMsg.bad{color:#f85149}
  .empty{color:var(--sub);font-size:.9rem;padding:14px 2px}
  @media (max-width:520px){ .avatar{width:64px;height:64px} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <img class="avatar" src="avatar.jpg" alt="이석창 강사">
    <div class="head-txt">
      <span class="eyebrow">CLASS MATERIALS</span>
      <h1>강의 <span>자료실</span></h1>
      <p class="who">이석창 강사 · 과정별 자료와 실습 링크를 여기에 모아둡니다.</p>
      <div class="contact">
        <a class="chip" href="/class/code/">💻 코드 공유</a>
        <a class="chip" href="mailto:leescvsir@gmail.com">✉️ 이메일 문의</a>
        <a class="chip" href="https://github.com/leelang7" target="_blank" rel="noopener">💻 GitHub</a>
        <a class="chip" href="profile.jpg" target="_blank" rel="noopener">👤 강사 프로필</a>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <div class="codebox">
    <div class="cb-head">
      <span>🔑 수업 코드가 있나요?</span>
      <small>코드를 넣으면 해당 과정 자료가 열립니다</small>
    </div>
    <div class="cb-row">
      <input id="code" type="text" placeholder="예: kdt2026" autocomplete="off" spellcheck="false">
      <button id="apply">열기</button>
      <button id="clear" class="ghost" style="display:none">코드 지우기</button>
    </div>
    <p id="codeMsg"></p>
  </div>

  <div class="note">
    <b>안내</b> · 과정 제목을 누르면 자료가 펼쳐집니다. 자료는 수업 진행에 따라 계속 추가·수정되니
    이 주소(<b>real.allthatai.kr/class</b>)만 저장해두세요. 링크가 열리지 않으면 로그인한 구글 계정을 확인해 주세요.
  </div>

  <footer>
    <span>© AllThatAI · 이석창</span>
    <span><a href="https://real.allthatai.kr">real.allthatai.kr</a></span>
  </footer>
</div>

<script>
/* 자료 출처 우선순위 (앞이 실패하면 뒤로):
     1) /api/class-data/  — 관리 페이지에서 저장한 최신본(서버 저장소가 연결된 경우)
     2) data.json         — 저장소 없이도 쓰는 정적 파일(내가 교체·배포)
     3) FALLBACK          — 최후 방어. 어떤 경우에도 빈 화면이 되지 않게. */
const FALLBACK = [{
  course: "공통 자료", icon: "📚", desc: "모든 과정 공통 자료", open: true,
  items: [{ icon: "📁", title: "강의 자료 폴더",
    desc: "수업 슬라이드·실습 파일 (구글 드라이브)",
    url: "https://drive.google.com/drive/folders/1NqDl6BeNjKOngikU7QLf2-BPvMAOR6ZV",
    badge: "NEW" }]
}];

const app = document.getElementById("app");
const esc = s => (s ?? "").toString()
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const safeUrl = u => /^https?:\/\//i.test(u ?? "") ? u : "#";

function draw(courses) {
  const live = (courses || []).filter(c => (c.items || []).length);
  if (!live.length) { app.innerHTML = '<p class="empty">등록된 자료가 아직 없습니다.</p>'; return; }
  app.innerHTML = live.map(c => `
    <details class="course"${c.open ? " open" : ""}>
      <summary>
        <span class="folder">${esc(c.icon) || "📁"}</span>
        <span class="c-txt"><b>${esc(c.course)}</b>${c.desc ? `<small>${esc(c.desc)}</small>` : ""}</span>
        <span class="count">${c.items.length}개</span>
        <span class="caret">›</span>
      </summary>
      <div class="files">
        ${c.items.map(i => `
          <a class="file" href="${esc(safeUrl(i.url))}" target="_blank" rel="noopener">
            <span class="fi">${esc(i.icon) || "🔗"}</span>
            <span class="ft"><b>${esc(i.title)}</b>${i.desc ? `<small>${esc(i.desc)}</small>` : ""}</span>
            ${i.badge ? `<span class="badge">${esc(i.badge)}</span>` : ""}
            <span class="go">↗</span>
          </a>`).join("")}
      </div>
    </details>`).join("");
}

const pick = d => (d && Array.isArray(d.courses) && d.courses.length) ? d.courses : null;

const CODE_KEY = "classCode";
const $ = s => document.querySelector(s);
const savedCode = () => { try { return localStorage.getItem(CODE_KEY) || ""; } catch (_) { return ""; } };

/* 코드가 있으면 서버가 그 과정까지 포함해 내려준다. 없으면 공개 과정만.
   (필터링은 서버에서 한다 — 다른 반 자료가 브라우저에 아예 안 내려오게) */
function load(code) {
  const q = code ? `?code=${encodeURIComponent(code)}` : "";
  app.innerHTML = '<p class="empty">자료를 불러오는 중…</p>';
  return fetch(`/api/class-data/${q}`, { cache: "no-store" })
    .then(r => r.ok ? r.json() : null)
    .then(d => { const c = pick(d); if (!c) throw new Error("empty"); draw(c); return c.length; })
    .catch(() => fetch("data.json", { cache: "no-store" }).then(r => r.json())
      .then(d => {
        // API가 안 될 때의 폴백 — 이때는 공개 과정만 보여준다.
        const all = pick(d) || FALLBACK;
        const open = all.filter(c => (c.access || "public") === "public");
        draw(open.length ? open : FALLBACK);
        return open.length;
      })
      .catch(() => { draw(FALLBACK); return FALLBACK.length; }));
}

function refreshClearBtn() {
  const has = !!savedCode();
  $("#clear").style.display = has ? "" : "none";
  $("#code").value = savedCode();
}

// 코드 입력 UI가 없더라도 자료 렌더는 반드시 동작해야 한다(요소 참조로 스크립트가 죽지 않게).
if ($("#apply") && $("#code") && $("#clear")) {
$("#apply").onclick = async () => {
  const code = $("#code").value.trim();
  const msg = $("#codeMsg");
  if (!code) { msg.className = "bad"; msg.textContent = "코드를 입력해 주세요."; return; }
  const before = await fetch("/api/class-data/", { cache: "no-store" })
    .then(r => r.json()).then(d => (d.courses || []).length).catch(() => 0);
  const after = await load(code);
  if (after > before) {
    try { localStorage.setItem(CODE_KEY, code); } catch (_) {}
    msg.className = "ok"; msg.textContent = "코드 확인 완료 — 해당 과정이 열렸어요.";
  } else {
    msg.className = "bad"; msg.textContent = "맞는 코드가 없어요. 강사에게 확인해 주세요.";
  }
  refreshClearBtn();
};

$("#clear").onclick = () => {
  try { localStorage.removeItem(CODE_KEY); } catch (_) {}
  $("#code").value = "";
  $("#codeMsg").className = ""; $("#codeMsg").textContent = "";
  refreshClearBtn();
  load("");
};

$("#code").addEventListener("keydown", e => { if (e.key === "Enter") $("#apply").click(); });

refreshClearBtn();
}   // 코드 입력 UI 가드 끝 — 아래 로드는 UI 유무와 무관하게 항상 실행
load(savedCode());
</script>
</body>
</html>
