<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의 자료실 — 이석창 강사</title>
<meta name="description" content="수업에서 쓰는 자료·링크를 한곳에 모았습니다.">
<meta name="robots" content="noindex, nofollow">
<meta property="og:title" content="강의 자료실 — 이석창 강사">
<meta property="og:description" content="수업 자료와 실습 링크를 한곳에서.">
<meta property="og:type" content="website">
<link rel="icon" href="/appicon.png">
<style>
  :root{
    --bg:#0d1117; --card:#161b22; --card2:#1c232c; --line:#2a323d;
    --ink:#e6edf3; --sub:#9aa7b4; --accent:#4fc0d0; --accent2:#7c9cff;
    --radius:16px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.6;
    -webkit-font-smoothing:antialiased;padding:0 20px 64px;
  }
  .wrap{max-width:760px;margin:0 auto}

  header{padding:56px 0 28px;border-bottom:1px solid var(--line);margin-bottom:28px}
  .eyebrow{
    display:inline-block;font-size:.78rem;letter-spacing:.14em;color:var(--accent);
    border:1px solid rgba(79,192,208,.35);background:rgba(79,192,208,.08);
    padding:5px 12px;border-radius:99px;margin-bottom:16px;
  }
  h1{font-size:clamp(1.7rem,5vw,2.3rem);letter-spacing:-.02em;font-weight:800;line-height:1.25}
  h1 span{color:var(--accent)}
  .who{margin-top:10px;color:var(--sub);font-size:.98rem}

  .sec{margin:34px 0 14px;display:flex;align-items:baseline;gap:10px}
  .sec h2{font-size:1.05rem;font-weight:700}
  .sec small{color:var(--sub);font-size:.82rem}

  .grid{display:grid;gap:12px}
  .item{
    display:flex;align-items:center;gap:14px;text-decoration:none;color:inherit;
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;transition:.15s;
  }
  .item:hover{border-color:var(--accent);background:var(--card2);transform:translateY(-1px)}
  .ico{
    flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    font-size:1.25rem;background:rgba(79,192,208,.12);border:1px solid rgba(79,192,208,.25);
  }
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-size:1rem;font-weight:700}
  .txt small{display:block;color:var(--sub);font-size:.85rem;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .go{flex:none;color:var(--sub);font-size:1.1rem}
  .item:hover .go{color:var(--accent)}
  .badge{
    flex:none;font-size:.7rem;padding:3px 8px;border-radius:99px;
    background:rgba(124,156,255,.14);color:var(--accent2);border:1px solid rgba(124,156,255,.3);
  }

  .note{
    margin-top:26px;background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:16px 18px;color:var(--sub);font-size:.9rem;
  }
  .note b{color:var(--ink)}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);
    color:var(--sub);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
  footer a{color:var(--accent);text-decoration:none}
  .empty{color:var(--sub);font-size:.9rem;padding:14px 2px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <span class="eyebrow">CLASS MATERIALS</span>
    <h1>강의 <span>자료실</span></h1>
    <p class="who">이석창 강사 · 수업에 쓰는 자료와 링크를 여기에 모아둡니다.</p>
  </header>

  <main id="app"></main>

  <div class="note">
    <b>안내</b> · 자료는 수업 진행에 따라 계속 추가·수정됩니다. 이 주소(<b>real.allthatai.kr/class</b>)만 저장해두면
    항상 최신 자료를 볼 수 있어요. 열리지 않으면 로그인한 구글 계정을 확인해 주세요.
  </div>

  <footer>
    <span>© AllThatAI</span>
    <span><a href="https://real.allthatai.kr">real.allthatai.kr</a></span>
  </footer>
</div>

<script>
/* ───────────────────────────────────────────────────────────
   자료 관리: 아래 RESOURCES 배열만 고치면 됩니다.
     group : 묶음 제목 (같은 이름끼리 한 섹션으로 묶임)
     icon  : 이모지 아이콘
     title : 자료 이름
     desc  : 한 줄 설명
     url   : 링크
     badge : (선택) 'NEW' 같은 표시
   ─────────────────────────────────────────────────────────── */
const RESOURCES = [
  {
    group: "수업 자료",
    icon: "📁",
    title: "강의 자료 폴더",
    desc: "수업 슬라이드·실습 파일 (구글 드라이브)",
    url: "https://drive.google.com/drive/folders/1NqDl6BeNjKOngikU7QLf2-BPvMAOR6ZV",
    badge: "NEW"
  },
];

const app = document.getElementById("app");
if (!RESOURCES.length) {
  app.innerHTML = '<p class="empty">등록된 자료가 아직 없습니다.</p>';
} else {
  const groups = [];
  for (const r of RESOURCES) {
    let g = groups.find(x => x.name === r.group);
    if (!g) { g = { name: r.group, items: [] }; groups.push(g); }
    g.items.push(r);
  }
  app.innerHTML = groups.map(g => `
    <section>
      <div class="sec"><h2>${g.name}</h2><small>${g.items.length}개</small></div>
      <div class="grid">
        ${g.items.map(i => `
          <a class="item" href="${i.url}" target="_blank" rel="noopener">
            <span class="ico">${i.icon || "🔗"}</span>
            <span class="txt"><b>${i.title}</b><small>${i.desc || ""}</small></span>
            ${i.badge ? `<span class="badge">${i.badge}</span>` : ""}
            <span class="go">↗</span>
          </a>`).join("")}
      </div>
    </section>`).join("");
}
</script>
</body>
</html>
